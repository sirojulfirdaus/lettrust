# Owner: Dws (PIC 1) | Status: COMPLETE | Ref: SA §13.1, §13.2, §18.1
[project]
name = "lettrust-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider -m 'not real_registry'"
markers = [
    "integration: membutuhkan Anvil nyata (jalankan dengan pytest -m integration)",
    "real_registry: conformance terhadap Web3RegistryAdapter + Anvil nyata (docker compose exec backend python -m pytest -m real_registry tests/conformance)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
